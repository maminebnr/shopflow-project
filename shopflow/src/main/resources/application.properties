spring.application.name=shopflow
# ===================================================================
# H2 Datasource Configuration
# ===================================================================
# Creates an in-memory database named 'testdb'
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# H2 Web Console Configuration
# ===================================================================
# Enables the browser-based H2 console UI
spring.h2.console.enabled=true
# Sets the path to access it (e.g., http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
# Explicitly sets the database dialect for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' modifies the schema based on your entities without deleting data
spring.jpa.hibernate.ddl-auto=update
# Shows the generated SQL queries in the console log
spring.jpa.show-sql=true
# Makes the console SQL output easily readable
spring.jpa.properties.hibernate.format_sql=true

